<style>
@font-face{font-family:'Fredoka';src:url('Fredoka.ttf') format('truetype-variations'),url('Fredoka.ttf') format('truetype');font-weight:300 700;font-style:normal;font-display:swap}
:root{--bg:#F5F8FF;--dot:#D9E4FB;--card:#fff;--ink:#0E1630;--mut:#6B7BA8;--ac:#4C7DFF;--dk:#2C55D6;--pl:#E4ECFF;--ln:#D6E2FB;--rd:#FF5C74;color-scheme:light;accent-color:var(--ac);caret-color:var(--ac);scrollbar-color:var(--ln) transparent;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg) radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/26px 26px;color:var(--ink);font:500 15px Fredoka,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:10px 16px;background:var(--ac);color:#fff;cursor:pointer}
button.g{background:var(--card);color:var(--dk);border:2px solid var(--ln)}
button:disabled{opacity:.45}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#hud,#edtop{display:flex;align-items:center;gap:12px;padding:8px 14px}
#pz{width:40px;height:40px;padding:0;background:none;display:flex;gap:6px;align-items:center;justify-content:center}
#pz i{width:8px;height:24px;border-radius:3px;background:var(--ac)}
#bt{position:relative;width:128px;height:36px;border:4px solid var(--ac);border-radius:12px;background:#fff;flex:none}
#bt::after{content:"";position:absolute;right:-11px;top:7px;width:6px;height:12px;border-radius:0 4px 4px 0;background:var(--ac)}
#bt u{position:absolute;inset:2px;border-radius:7px;background:#C7D8FF;transform-origin:left;transition:background .3s}
#tm{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;font-weight:700;color:var(--dk)}
#ttl{flex:1;text-align:right;line-height:1.1;overflow:hidden;min-width:0}
#ttl b{display:block;font-size:24px;color:var(--ac)}#ttl small{color:var(--mut);white-space:nowrap}
#edtop b{flex:1;text-align:center;font-size:18px}
#stage{flex:1;min-height:0;position:relative}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:var(--mut);font-size:13px;pointer-events:none;padding:0 16px}
#hint{display:none}
.ov{position:fixed;inset:0;background:var(--bg) radial-gradient(var(--dot) 1.6px,transparent 1.8px) 0 0/26px 26px;overflow:auto;z-index:5;user-select:text;text-align:center}
#mw{position:relative;min-height:100%;padding:max(64px,calc(env(safe-area-inset-top) + 52px)) 0 40px}
#wr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.col{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:0 46px}
#lcd{display:block;width:100%;max-width:400px;margin:0 auto 96px;filter:drop-shadow(0 6px 0 rgba(14,22,48,.14))}
#more{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;z-index:2;display:flex;align-items:center;gap:6px;padding:8px 14px 8px 10px;border-radius:14px;background:#fff;border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);color:var(--dk);font-weight:600;text-decoration:none}
@keyframes fl{to{stroke-dashoffset:-30}}.fl{animation:fl 1.1s linear infinite}.fr{animation:fl 1.1s linear infinite reverse}
.ov h1{font-size:60px;line-height:1;margin:6px 0;color:var(--ac);letter-spacing:-.02em}
.ov h3{margin:26px 0 8px;font-size:20px}
.mut{color:var(--mut)}
#lv{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.t{flex:0 0 calc((100% - 28px)/5);min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:8px 2px 7px;border-radius:12px;background:#fff;color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);text-align:center;line-height:1.15}
.t b{font-size:22px;line-height:1;color:var(--ac)}
.t span{font-size:9.5px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.t small{font-size:9px}
.t.gold{border-color:#F6DC8A;box-shadow:0 3px 0 #F6DC8A}.t.gold b{color:#E0A100}
.row.gold span{color:#B98300;font-weight:700}
.row{display:flex;gap:6px;align-items:center;margin:6px 0}.row span{flex:1}
#mo{position:fixed;inset:0;display:grid;place-items:center;background:rgba(14,22,48,.45);z-index:9;padding:16px}
.card{position:relative;background:#fff;border:2px solid var(--ln);border-radius:20px;padding:22px 0 0;max-width:360px;width:100%;text-align:center;box-shadow:0 8px 0 var(--ln);overflow:hidden}
.card h2{margin:0 18px 4px;padding:0 20px;font-size:28px;color:var(--ac);line-height:1.1}.card p{margin:6px 18px;color:var(--mut)}
.card textarea{width:calc(100% - 36px);box-sizing:border-box;font:12px monospace;border-radius:10px;border:2px solid var(--ln);padding:8px;color:var(--ink);user-select:text}
.card p.pr{color:var(--dk);font-weight:700}.card p.new{color:#E0A100;font-weight:700}
.eye{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%;background:var(--pl);color:var(--dk);display:grid;place-items:center}
#eyeb{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:54px;height:54px;padding:0;border-radius:50%;display:grid;place-items:center;z-index:8;box-shadow:0 4px 0 var(--ln)}
.bt{margin-top:14px}
.bt button{display:block;width:100%;background:none;color:var(--ink);border-radius:0;border:0;border-top:2px solid var(--ln);padding:14px;font-size:17px}
.bt button:first-child{color:var(--dk);font-weight:700}
#edbar{background:#fff;border-top:2px solid var(--ln);border-radius:22px 22px 0 0;padding:8px 12px 10px;height:40vh;flex:none;box-sizing:border-box;overflow:auto}
#tabs{display:flex;gap:6px;margin-bottom:8px}#tabs button{flex:1;padding:8px;background:var(--pl);color:var(--dk)}#tabs button.on{background:var(--ac);color:#fff}
#edbar.min{height:auto}#edbar.min #pane{display:none}
.pal{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;background:var(--pl);color:var(--ink);font-size:11px;border:2px solid transparent;border-radius:12px}
.chip.on{border-color:var(--ac);background:#fff}.chip img{width:58px;height:40px;object-fit:contain}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:2px 0 6px}.sw button{width:36px;height:36px;padding:0;border:3px solid #fff;box-shadow:0 0 0 2px var(--ln);border-radius:50%}.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.fld{display:flex;align-items:center;gap:8px;margin:8px 0}.fld>span{flex:1}
.fld input{width:90px;flex:none;text-align:center}
.i{width:24px;height:24px;padding:0;border-radius:50%;background:var(--pl);color:var(--dk);font:italic 700 14px Georgia,serif;border:0}
input{font:inherit;padding:8px;border-radius:10px;border:2px solid var(--ln);background:#fff;color:var(--ink);min-width:0}
#tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(40vh + 10px);max-width:min(340px,92vw);background:var(--ink);color:#fff;padding:10px 14px;border-radius:14px;z-index:8;font-size:14px;text-align:center}
.pks{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}.pk{padding:8px 12px}
.warn{margin:4px 0;color:#C2283F}.ok{margin:4px 0;color:#1E8F63}
</style></head>
