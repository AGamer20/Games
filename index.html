<style>
:root{--bg:#14161b;--tile:#1f232b;--edge:#2d323d;--text:#e8e6e1;--muted:#8a8f9c;--glow:#ffc83d}
@media (prefers-color-scheme:light){:root{--bg:#f2f0eb;--tile:#fff;--edge:#d9d5cc;--text:#1d1f24;--muted:#6b6f7a;--glow:#d98f00}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  display:flex;flex-direction:column;align-items:center;padding:56px 20px 32px;min-height:100vh}
h1{font-size:clamp(1.8rem,5vw,2.8rem);margin:0 0 40px;letter-spacing:.02em;font-weight:700}
#grid{display:flex;flex-direction:column;align-items:center;gap:44px;width:100%}
.row{display:flex;justify-content:center;gap:28px;flex-wrap:nowrap}
.row .game{width:clamp(84px,26vw,140px)}
.game{position:relative;display:block;aspect-ratio:1;border-radius:28px;background:var(--tile);border:2px solid var(--edge);
  display:grid;place-items:center;padding:18px;text-decoration:none;color:var(--text);
  transition:transform .15s,border-color .15s,box-shadow .15s}
.game:hover,.game:focus-visible{transform:translateY(-6px) scale(1.04);border-color:var(--glow);
  box-shadow:0 0 28px color-mix(in srgb,var(--glow) 45%,transparent);outline:none}
.game img{width:100%;height:100%;object-fit:contain;border-radius:12px}
.game .fallback{font-size:3rem;font-weight:700;color:var(--glow)}
.game::after{content:attr(data-name);position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:.85rem;color:var(--muted);opacity:0;transition:opacity .15s;pointer-events:none}
.game:hover::after,.game:focus-visible::after{opacity:1}
footer{margin-top:auto;padding-top:48px;font-size:.8rem;color:var(--muted)}
/* Per-game tiles: each one borrows the look of that game's main menu. */
/* Puzzuino: dotted paper background; the border is four wires twisting round the edge (drawn in JS) */
.game.puzzuino{--glow:#4C7DFF;border-color:transparent;padding:18px;
  background:#F5F8FF radial-gradient(#D9E4FB 1.4px,transparent 1.7px) center/18px 18px}
.game.puzzuino:hover,.game.puzzuino:focus-visible{border-color:transparent}
.game .wires{position:absolute;left:-2px;top:-2px;pointer-events:none}
/* Hifz Al-Dhikr: dark menu background, gold border */
.game.hifz{--tile:#262a22;--edge:#d4af37;--glow:#d4af37}
/* Math Rush: chalkboard blue inside the wooden frame */
.game.mathrush{--tile:#34495e;--edge:#8e6a3d;--glow:#b98b4f;border-width:6px;padding:14px;
  box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 5px 15px rgba(0,0,0,.3)}
.game.mathrush:hover,.game.mathrush:focus-visible{
  box-shadow:inset 0 0 10px rgba(0,0,0,.5),0 0 28px color-mix(in srgb,var(--glow) 45%,transparent)}
/* Techno Seek: 2-bit black and white */
.game.technoseek{--tile:#000;--edge:#fff;--glow:#fff}
@media (prefers-reduced-motion:reduce){.game{transition:none}}
</style>
</head>
<body>
<h1>Games</h1>
<main id="grid" aria-label="Games"></main>
<footer id="note"></footer>

<script>
// Each inner list is one row. A slot is either { folder } (icon read from that game's tab icon)
// or { name, letter, href, icon? } (custom link; shows icon if given, else the letter).
// cls (optional) adds a class so the tile can be styled per game (see .game.puzzuino etc.).
const ROWS = [
  [
    { folder: "Puzzuino", cls: "puzzuino" },
    { name: "Hifz Al-Dhikr", letter: "H", href: "https://agamer20.github.io/Games/Hifz-Al-Dhikr/",
      icon: "Hifz-Al-Dhikr/Hifz-al-dhikr-logo-stacked.png", cls: "hifz" }
  ],
  [
    { folder: "Lights-On" },
    { folder: "Math-Rush", cls: "mathrush" },
    { folder: "Techno-Seek", cls: "technoseek" }
  ]
];

const grid = document.getElementById("grid");

function tile(row, name, href, cls) {
  const a = document.createElement("a");
  const label = name.replace(/-/g, " ");
  a.className = "game" + (cls ? " " + cls : "");
  a.href = href;
  a.dataset.name = label;
  a.setAttribute("aria-label", label);
  row.appendChild(a);
  return a;
}

function showFallback(a, name) {
  a.querySelectorAll("img,.fallback").forEach(el => el.remove());
  const s = document.createElement("span");
  s.className = "fallback";
  s.textContent = name[0].toUpperCase();
  a.appendChild(s);
}

// Reads the game's own index.html and uses the icon from its <link rel="icon"> tab icon.
async function loadIcon(name, a) {
  const base = new URL(encodeURIComponent(name) + "/", location.href);
  let iconUrl = new URL("favicon.ico", base).href;
  try {
    const res = await fetch(new URL("index.html", base));
    if (!res.ok) throw new Error(res.status);
    const doc = new DOMParser().parseFromString(await res.text(), "text/html");
    const link = doc.querySelector('link[rel~="icon" i]') || doc.querySelector('link[rel~="shortcut" i]');
    if (link && link.getAttribute("href")) iconUrl = new URL(link.getAttribute("href"), base).href;
    const title = doc.querySelector("title");
    if (title && title.textContent.trim()) {
      a.dataset.name = title.textContent.trim();
      a.setAttribute("aria-label", a.dataset.name);
    }
  } catch (e) {
    if (location.protocol === "file:") {
      document.getElementById("note").textContent =
        "Open this page through a web server or GitHub Pages so game icons can load.";
    }
  }
  const img = new Image();
  img.alt = "";
  img.onerror = () => showFallback(a, name);
  img.src = iconUrl;
  a.appendChild(img);
}

// Puzzuino's border: ONE wire, drawn like a menu wire (same 7px wire / 11px shadow / white flowing dashes),
// running round the tile edge. Its colour changes in four sections (red, ink, yellow, green), one quarter of the loop each,
// that travel round it at the same speed as the electricity.
const WIRE_COLORS = ["#FF5C74", "#2B3252", "#FFC94D", "#3FCB8E"];
function drawWires(a, svg) {
  const S = a.offsetWidth;
  if (!S) return;
  const R = 28, WIDTH = 7, SHADOW = 11, SPARK_W = 2.4;      // tile corner radius; wire, shadow and spark sizes from the menu wires
  const c = 1 + SHADOW / 2, rx = R - c, len = S - 2 * c;     // wire centre-line inset, so the shadow just touches the tile edge
  const perim = 4 * (S - 2 * R) + 2 * Math.PI * rx;
  const sparks = Math.max(4, Math.round(perim / 15)), sp = 100 / sparks;   // electricity: 3 on / 12 off, like the menu wires
  const period = 100, q = period / 4;                        // the four colours fill the loop exactly once
  const box = `x="${c}" y="${c}" width="${len}" height="${len}" rx="${rx}" pathLength="100" fill="none"`;
  let out = `<rect ${box} stroke="rgba(14,22,48,.22)" stroke-width="${SHADOW}"/>`;
  WIRE_COLORS.forEach((col, k) => {
    const dashes = [0, k * q, q, period - (k + 1) * q].map(v => v.toFixed(3)).join(" ");
    out += `<rect ${box} data-p="${period}" data-t="${Math.round(550 * sparks)}" stroke="${col}" stroke-width="${WIDTH}" stroke-dasharray="${dashes}"/>`;
  });
  out += `<rect ${box} data-p="${sp.toFixed(3)}" data-t="550" stroke="#fff" stroke-width="${SPARK_W}" stroke-linecap="round" stroke-dasharray="${(sp * 0.2).toFixed(3)} ${(sp * 0.8).toFixed(3)}"/>`;
  svg.setAttribute("width", S);
  svg.setAttribute("height", S);
  svg.setAttribute("viewBox", `0 0 ${S} ${S}`);
  svg.innerHTML = out;
  // Electricity runs 2 dash periods per 1.1s like the menu wires; the colour sections move at that same speed.
  // Left still for people who prefer reduced motion.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    svg.querySelectorAll("[data-p]").forEach(el =>
      el.animate([{ strokeDashoffset: 0 }, { strokeDashoffset: -el.dataset.p }], { duration: +el.dataset.t, iterations: Infinity }));
  }
}

function addWires(a) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "wires");
  svg.setAttribute("aria-hidden", "true");
  a.insertBefore(svg, a.firstChild);
  new ResizeObserver(() => drawWires(a, svg)).observe(a);
}

ROWS.forEach(slots => {
  const row = document.createElement("div");
  row.className = "row";
  grid.appendChild(row);
  slots.forEach(slot => {
    if (slot.folder) {
      const a = tile(row, slot.folder, encodeURIComponent(slot.folder) + "/", slot.cls);
      if (slot.cls === "puzzuino") addWires(a);
      loadIcon(slot.folder, a);
    } else {
      const a = tile(row, slot.name, slot.href, slot.cls);
      if (slot.icon) {
        const img = new Image();
        img.alt = "";
        img.onerror = () => showFallback(a, slot.letter);
        img.src = slot.icon;
        a.appendChild(img);
      } else {
        showFallback(a, slot.letter);
      }
    }
  });
});
</script>
</body>
</html>
