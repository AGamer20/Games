<style>
@font-face {
  font-family: 'Glowtone';
  src: url('glowtone.otf') format('opentype');
  font-display: swap;
}
:root {
  --bg-color: #121212; --grid-bg: #1d1d1d; --cell-off: #333; --cell-on: #ffd700;
  --text-color: #f0f0f0; --primary-color: #007bff; --secondary-color: #6c757d;
  --extra-color: #ff8c00; --perfect-color: #28a745; --shadow-color: rgba(255, 215, 0, 0.5);
  --board: min(90vmin, 500px);
}
* { -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-color);
  display: flex; align-items: center; justify-content: center;
  height: 100vh; height: 100dvh; margin: 0; overflow: hidden;
}
body.rtl { direction: rtl; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

.screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; justify-content: safe center;
  width: 100%; height: 100%; box-sizing: border-box; padding: 10px 0;
  position: absolute; top: 0; left: 0; overflow-y: auto;
  opacity: 1; visibility: visible; z-index: 1;
  transition: opacity 0.3s ease-in-out, visibility 0s;
}
.screen.hidden {
  opacity: 0; visibility: hidden; pointer-events: none; z-index: 0;
  transition: opacity 0.3s ease-in-out, visibility 0s 0.3s;
}
h1 {
  font-family: 'Glowtone', 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center;
  text-shadow: 0 0 8px rgba(255,255,255,.6), 0 0 10px rgba(255,255,255,.4); direction: ltr;
}
h1 .word { margin-right: .3em; }
h1 svg { height: 1.15em; width: auto; flex: none; margin: 0 .1em 0 .06em; transform: rotate(35deg); filter: drop-shadow(0 0 5px rgba(255,255,255,.7)); }
h2 { text-align: center; }

.button {
  background-color: var(--primary-color); color: white; border: none; border-radius: 8px;
  padding: 12px 24px; font-family: inherit; font-size: 1.2em; cursor: pointer; margin: 10px;
  transition: transform 0.2s, background-color 0.2s;
}
.button:disabled { cursor: not-allowed; }
.button.timed-button { opacity: 0.6; transform: none !important; }
@media (hover: hover) { .button:not(:disabled):hover { transform: scale(1.05); } }
.button.secondary { background-color: var(--secondary-color); }
.button.danger { background-color: #dc3545; }
.button.dev-button { background-color: var(--extra-color); }
.row { display: flex; flex-wrap: wrap; justify-content: center; }

#info-bar { display: flex; justify-content: space-between; width: var(--board); font-size: 1.2em; font-weight: 600; }
#grid-container {
  display: grid; gap: 10px; background-color: var(--grid-bg); padding: 15px; border-radius: 12px;
  box-sizing: border-box; width: max(160px, min(var(--board), calc(100dvh - 230px))); aspect-ratio: 1;
  margin: 20px 0; direction: ltr;
}
.cell {
  background-color: var(--cell-off); border: 0; padding: 0; border-radius: 8px; cursor: pointer;
  touch-action: manipulation;
  transition: transform 0.1s ease-out, background-color 0.2s ease, box-shadow 0.25s ease;
}
.cell:active { transform: scale(0.95); }
.cell.on { background-color: var(--cell-on); box-shadow: 0 0 20px var(--shadow-color); }
.cell.hint { animation: hintPulse 0.8s ease-in-out 3; outline: 3px solid var(--primary-color); }
@keyframes hintPulse { 50% { transform: scale(0.85); } }

#level-select-screen .levels-grid {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(8px, 2vw, 15px);
  padding: 0 10px; width: 95%; max-width: 500px; box-sizing: border-box;
}
.level-button {
  font-weight: 600; padding: 5% 0; margin: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; width: 100%; height: auto;
}
.level-button .level-num { font-size: clamp(1rem, 5vw, 1.5em); }
.level-button .level-pb { font-size: clamp(0.5rem, 2.5vw, 0.7em); margin-top: 2px; }
.level-button.locked { background-color: #555; color: #888; cursor: not-allowed; transform: none !important; }
.level-button.extra { background-color: transparent; border: 3px solid var(--extra-color); color: var(--extra-color); }
.level-button.extra:hover { background-color: var(--extra-color); color: white; }
.level-button.perfect { background-color: var(--perfect-color); border-color: var(--perfect-color); color: white; }

.random-btn {
  width: 95%; max-width: 480px; box-sizing: border-box; margin: 16px 10px 4px; background-color: #17a2b8;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.random-btn.r5 { background-color: var(--extra-color); }
.random-btn small { font-size: 0.6em; font-weight: 400; }
.random-btn:disabled { background-color: #3a3a3a; color: #999; }
.menu-btn { margin-top: 28px; background-color: transparent; border: 2px solid var(--secondary-color); color: #ccc; font-size: 1em; }
.menu-btn:hover { background-color: var(--secondary-color); color: #fff; }

#win-modal { background-color: rgba(0,0,0,.8); backdrop-filter: blur(5px); z-index: 10; }
#win-modal-content { border-radius: 15px; padding: 30px; text-align: center; max-width: 90vw; }
#win-modal:not(.hidden) #win-modal-content { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

.credits {
  position: absolute; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0;
  margin: 0; text-align: center; font-size: 0.8em; color: #888;
}

#tutorial-overlay { z-index: 100; background-color: transparent; overflow: hidden; }
#tutorial-highlight {
  position: absolute; border-radius: 10px; box-shadow: 0 0 0 9999px rgba(0,0,0,.7);
  transition: all 0.4s ease-in-out; pointer-events: none;
}
#tutorial-highlight.spotlight-bright { box-shadow: 0 0 20px 15px rgba(238,238,238,.7), 0 0 0 9999px rgba(0,0,0,.7); }
#tutorial-text-box {
  position: absolute; background-color: var(--grid-bg); padding: 20px; border-radius: 10px;
  border: 1px solid var(--cell-off); max-width: 300px; text-align: center; box-sizing: border-box;
}
.rtl #tutorial-text-box { font-size: clamp(1rem, 5vw, 1.2em); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>
</head>

<script>
const devmode = 0;
const TUTORIAL_DELAY = 2000; // ms the OK button stays locked on each tutorial step
const DEFAULT_LANG = (navigator.language || '').toLowerCase().startsWith('ar') ? 'ar' : 'en';

const levels = [
  { par: 2, size: 4, pattern: "1011000110101100" }, { par: 4, size: 4, pattern: "1110010001001110" },
  { par: 3, size: 4, pattern: "1010000111111111" }, { par: 4, size: 4, pattern: "1001100101101111" },
  { par: 5, size: 4, pattern: "1110110110100100" },
  { par: 7, size: 5, pattern: "1111001010011100001100001" },
  { par: 8, size: 5, pattern: "0010010100101111001000010" }, { par: 9, size: 5, pattern: "0011110010101000011001111" },
  { par: 11, size: 5, pattern: "1111101111101101001101001" }, { par: 13, size: 5, pattern: "1010010100111000011101111" },
];

const translations = {
  en: {
    level: "Level", moves: "Moves", par: "Par", best: "Best", newGame: "New Game", continue: "Continue",
    levelSelect: "Level Select", resetProgress: "Reset Progress", mainMenu: "Main Menu", reset: "Reset", menu: "Menu",
    skip: "Skip (Test)", levels4x4: "4x4 Levels", levels5x5: "5x5 Extra Levels",
    levelNComplete: "Level {n} Complete!", excellentSolve: "Excellent solve!", goodJob: "Good job!",
    campaignComplete: "Campaign Complete!",
    unlocked: "You unlocked <b>Level Select</b><br>and <b>5x5 Extra Levels!</b>", goToLevelSelect: "Go to Level Select",
    allLevelsComplete: "Congratulations!", allLevelsBeaten: "You have beaten all levels!", nextLevel: "Next Level", ok: "OK",
    resetConfirm: "Are you sure you want to reset all your progress? (This will also re-enable the tutorial.)",
    random4: "Random 4x4", random5: "Random 5x5", lock4: "Finish levels 1–5 to unlock", lock5: "Finish levels 6–10 to unlock", newPuzzle: "New Puzzle", puzzleSolved: "Puzzle Solved!", replay: "Replay",
    hint: "Hint", cell: "Row {r}, column {c}",
    tutorial_step1: "You can tap a tile to flip its light and the lights of its neighbors. (Try tapping this one.)",
    tutorial_step2: "The goal is to turn all the lights ON. The 'Par' is the best possible score for the level.",
    tutorial_step3: "Use these buttons to reset the level, get a hint, or return to the menu. Good luck!",
  },
  ar: {
    level: "مستوى", moves: "تحركات", par: "أقل حركات محتاجة", best: "أفضل", newGame: "لعبة جديدة", continue: "متابعة",
    levelSelect: "اختيار المستوى", resetProgress: "إعادة تعيين التقدم", mainMenu: "القائمة الرئيسية", reset: "إعادة تعيين", menu: "القائمة",
    skip: "تخطي (اختبار)", levels4x4: "مستويات 4x4", levels5x5: "مستويات إضافية 5x5",
    levelNComplete: "اكتمل المستوى {n}!", excellentSolve: "حل ممتاز!", goodJob: "عمل جيد!",
    campaignComplete: "اكتملت الحملة!",
    unlocked: "لقد فتحت <b>اختيار المستوى</b><br>و <b>5 مستويات إضافية 5x5!</b>", goToLevelSelect: "اذهب إلى اختيار المستوى",
    allLevelsComplete: "تهانينا!", allLevelsBeaten: "لقد تغلبت على جميع المستويات!", nextLevel: "المستوى التالي", ok: "حسنا",
    resetConfirm: "هل أنت متأكد من أنك تريد إعادة ضبط كل تقدمك؟ (سيؤدي هذا أيضًا إلى إعادة تمكين البرنامج التعليمي.)",
    random4: "لغز عشوائي 4x4", random5: "لغز عشوائي 5x5", lock4: "أنهِ المستويات 1–5 لفتحه", lock5: "أنهِ المستويات 6–10 لفتحه", newPuzzle: "لغز جديد", puzzleSolved: "تم حل اللغز!", replay: "إعادة اللعب",
    hint: "تلميح", cell: "صف {r}، عمود {c}",
    tutorial_step1: "اضغط على مربع لقلب ضوءه وأضواء جيرانه. حاول الضغط على هذا.",
    tutorial_step2: "الهدف هو تشغيل كل الأضواء. 'أقل حركات محتاجة' هو أفضل نتيجة ممكنة للمستوى.",
    tutorial_step3: "استخدم هذه الأزرار لإعادة ضبط المستوى أو الحصول على تلميح أو العودة إلى القائمة. بالتوفيق!",
  }
};
const T = () => translations[currentLanguage];

// Safe storage (can throw when blocked, e.g. some private modes or iframes)
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

let currentLanguage = DEFAULT_LANG;
const langParam = new URLSearchParams(window.location.search).get('lang');
if (langParam === 'en' || langParam === 'ar') {
  currentLanguage = langParam;
  store.set('lightsOnLanguage', langParam);
  window.history.replaceState({}, document.title, window.location.pathname);
} else {
  const saved = store.get('lightsOnLanguage');
  if (saved === 'en' || saved === 'ar') currentLanguage = saved;
}

const $ = id => document.getElementById(id);
const screens = Object.fromEntries(Array.from(document.querySelectorAll('.screen')).map(el => [el.id, el]));
const gridContainer = $('grid-container'), movesDisplay = $('moves-display'), levelDisplay = $('level-display');
const defaultProgress = () => ({ highestLevelBeaten: 0, pbs: {}, tutorialCompleted: false });
let gameState = { currentLevel: 1, random: null, gridSize: 4, moves: 0, cells: [], locked: false, progress: defaultProgress() };
let winTimer = null, hintTimer = null, tutorialRefresh = null;

/* ---------- Sound ---------- */
let audioCtx;
function tone(freq, dur = 0.12, delay = 0, type = 'sine') {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t0 = audioCtx.currentTime + delay;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(0.15, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
function triggerVibration(pattern) { if ('vibrate' in navigator) navigator.vibrate(pattern); }

/* ---------- Solver (GF(2) elimination): minimal set of presses that turns every light on ---------- */
const nb = (n, i) => {
  const r = (i / n) | 0, c = i % n, a = [i];
  if (r > 0) a.push(i - n); if (r < n - 1) a.push(i + n);
  if (c > 0) a.push(i - 1); if (c < n - 1) a.push(i + 1);
  return a;
};
function solve(n, on) {
  const N = n * n;
  const rows = Array.from({ length: N }, (_, r) => [nb(n, r).reduce((m, i) => m | (1 << i), 0), on[r] ? 0 : 1]);
  const pivots = [];
  let rk = 0;
  for (let c = 0; c < N; c++) {
    let p = -1;
    for (let r = rk; r < N; r++) if ((rows[r][0] >> c) & 1) { p = r; break; }
    if (p < 0) continue;
    [rows[rk], rows[p]] = [rows[p], rows[rk]];
    for (let r = 0; r < N; r++) if (r !== rk && ((rows[r][0] >> c) & 1)) { rows[r][0] ^= rows[rk][0]; rows[r][1] ^= rows[rk][1]; }
    pivots.push(c); rk++;
  }
  for (let r = rk; r < N; r++) if (rows[r][1]) return null;
  const free = [...Array(N).keys()].filter(c => !pivots.includes(c));
  let best = null;
  for (let combo = 0; combo < (1 << free.length); combo++) {
    let x = 0;
    free.forEach((f, k) => { if ((combo >> k) & 1) x |= 1 << f; });
    pivots.forEach((pc, k) => {
      let v = rows[k][1];
      free.forEach(f => { if (((rows[k][0] >> f) & 1) && ((x >> f) & 1)) v ^= 1; });
      if (v) x |= 1 << pc;
    });
    const sol = [...Array(N).keys()].filter(i => (x >> i) & 1);
    if (!best || sol.length < best.length) best = sol;
  }
  return best;
}

/* ---------- Language / screens ---------- */
function setLanguage(lang) {
  currentLanguage = lang;
  store.set('lightsOnLanguage', lang);
  document.body.classList.toggle('rtl', lang === 'ar');
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-translate-key]').forEach(el => {
    el.textContent = translations[lang][el.getAttribute('data-translate-key')] || el.textContent;
  });
  $('language-toggle-btn').textContent = lang === 'en' ? 'العربية' : 'English';
  labelCells(); updateUI(); updateStartScreen();
}
function showScreen(id) {
  clearTimeout(winTimer);
  Object.values(screens).forEach(s => s.classList.add('hidden'));
  screens[id].classList.remove('hidden');
}

/* ---------- Grid ---------- */
function labelCells() {
  const n = gameState.gridSize;
  gameState.cells.forEach((cell, i) =>
    cell.setAttribute('aria-label', T().cell.replace('{r}', ((i / n) | 0) + 1).replace('{c}', (i % n) + 1)));
}
function setOn(cell, on) { cell.classList.toggle('on', on); cell.setAttribute('aria-pressed', String(on)); }
function createGrid(size) {
  gridContainer.innerHTML = ''; gameState.cells = []; gameState.gridSize = size;
  gridContainer.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  for (let i = 0; i < size * size; i++) {
    const cell = document.createElement('button');
    cell.type = 'button'; cell.className = 'cell';
    cell.addEventListener('click', () => handleCellClick(i));
    gridContainer.appendChild(cell); gameState.cells.push(cell);
  }
  labelCells();
}
const curLevel = () => gameState.random || levels[gameState.currentLevel - 1];
function applyLevel(data) {
  if (gameState.gridSize !== data.size || !gameState.cells.length) createGrid(data.size);
  gameState.moves = 0; gameState.locked = false;
  clearTimeout(hintTimer);
  gameState.cells.forEach((cell, i) => { cell.classList.remove('hint'); setOn(cell, data.pattern[i] === '1'); });
  updateUI();
}
function loadLevel(n) { gameState.random = null; gameState.currentLevel = n; applyLevel(levels[n - 1]); }
function resetLevel() { applyLevel(curLevel()); }
function startGame(n) {
  if (n === 1 && !gameState.progress.tutorialCompleted) { runTutorial(); }
  else { loadLevel(n); showScreen('game-screen'); }
}
function startRandom(n) {
  const N = n * n;
  let on, sol;
  do {
    on = Array(N).fill(true);
    const k = (n === 4 ? 4 : 6) + Math.floor(Math.random() * (n === 4 ? 5 : 7));
    for (let j = 0; j < k; j++) nb(n, Math.floor(Math.random() * N)).forEach(i => on[i] = !on[i]);
    sol = solve(n, on);
  } while (!sol || sol.length < 3);
  gameState.random = { par: sol.length, size: n, pattern: on.map(b => b ? '1' : '0').join('') };
  applyLevel(gameState.random);
  showScreen('game-screen');
}

function handleCellClick(index) {
  if (gameState.locked) return;
  gameState.moves++;
  nb(gameState.gridSize, index).forEach(i => setOn(gameState.cells[i], !gameState.cells[i].classList.contains('on')));
  tone(gameState.cells[index].classList.contains('on') ? 620 : 420, 0.08);
  updateUI();
  if (gameState.cells.every(c => c.classList.contains('on'))) handleWin();
}
function showHint() {
  if (gameState.locked) return;
  const sol = solve(gameState.gridSize, gameState.cells.map(c => c.classList.contains('on')));
  if (!sol || !sol.length) return;
  clearTimeout(hintTimer);
  gameState.cells.forEach(c => c.classList.remove('hint'));
  const cell = gameState.cells[sol[0]];
  void cell.offsetWidth; cell.classList.add('hint'); tone(880, 0.1);
  hintTimer = setTimeout(() => cell.classList.remove('hint'), 2600);
}

/* ---------- Win ---------- */
function handleWin() {
  gameState.locked = true;
  triggerVibration([100, 50, 300, 50, 300, 150, 100, 50, 100, 150, 300, 50, 100]);
  [523, 659, 784, 1047].forEach((f, k) => tone(f, 0.25, k * 0.12));
  const L = curLevel(), t = T(), rnd = !!gameState.random, lvl = gameState.currentLevel;
  if (!rnd) {
    const p = gameState.progress;
    p.highestLevelBeaten = Math.max(p.highestLevelBeaten, lvl);
    if (!p.pbs[lvl] || gameState.moves < p.pbs[lvl]) p.pbs[lvl] = gameState.moves;
    saveProgress();
  }
  $('win-par').textContent = `${t.moves}: ${gameState.moves} (${t.par}: ${L.par})`;
  const title = $('win-title'), msg = $('win-message'), next = $('win-next-btn');
  msg.textContent = gameState.moves <= L.par ? t.excellentSolve : t.goodJob;
  const toSelect = () => showLevelSelect();
  if (rnd) {
    title.textContent = t.puzzleSolved; next.textContent = t.newPuzzle; next.onclick = () => startRandom(L.size);
  } else if (lvl === 5 && gameState.progress.highestLevelBeaten === 5) {
    title.textContent = t.campaignComplete; msg.innerHTML = t.unlocked;
    next.textContent = t.goToLevelSelect; next.onclick = toSelect;
  } else if (lvl === levels.length) {
    title.textContent = t.allLevelsComplete; msg.textContent = t.allLevelsBeaten;
    next.textContent = t.goToLevelSelect; next.onclick = toSelect;
  } else {
    title.textContent = t.levelNComplete.replace('{n}', lvl);
    next.textContent = t.nextLevel; next.onclick = () => startGame(lvl + 1);
  }
  $('win-replay-btn').onclick = () => { resetLevel(); showScreen('game-screen'); };
  // Let the player see the fully lit board before the modal appears
  winTimer = setTimeout(() => screens['win-modal'].classList.remove('hidden'), 600);
}

/* ---------- Menus ---------- */
function showLevelSelect() {
  const normCont = $('levels-grid-container-normal'), xtraCont = $('levels-grid-container-extra');
  [normCont, xtraCont].forEach(c => c.innerHTML = '');
  levels.forEach((levelData, idx) => {
    const i = idx + 1, isUnlocked = i <= gameState.progress.highestLevelBeaten + 1;
    const pb = gameState.progress.pbs[i], btn = document.createElement('button');
    btn.innerHTML = `<span class="level-num">${i}</span><span class="level-pb">${pb ? `${T().best}: ${pb}` : '---'}</span>`;
    btn.className = 'button level-button';
    if (!isUnlocked) { btn.classList.add('locked'); btn.disabled = true; }
    if (levelData.size === 5) btn.classList.add('extra');
    if (pb && pb <= levelData.par) btn.classList.add('perfect');
    if (isUnlocked) btn.onclick = () => startGame(i);
    (levelData.size === 4 ? normCont : xtraCont).appendChild(btn);
  });
  [[4, 5], [5, 10]].forEach(([n, need]) => {
    const b = $(`random-${n}-btn`), ok = gameState.progress.highestLevelBeaten >= need;
    b.disabled = !ok;
    b.innerHTML = `<span>${T()['random' + n]}</span>` + (ok ? '' : `<small>${T()['lock' + n]}</small>`);
    b.onclick = ok ? () => startRandom(n) : null;
  });
  showScreen('level-select-screen');
}
function updateUI() {
  const L = curLevel(); if (!L) return;
  levelDisplay.textContent = gameState.random ? T()['random' + gameState.random.size] : `${T().level} ${gameState.currentLevel}`;
  movesDisplay.textContent = `${T().moves}: ${gameState.moves} / ${T().par}: ${L.par}`;
}
function goToStartScreen() { updateStartScreen(); showScreen('start-screen'); }
function updateStartScreen() {
  const btn = $('start-game-btn'), next = gameState.progress.highestLevelBeaten + 1;
  if (gameState.progress.highestLevelBeaten >= 5) {
    btn.setAttribute('data-translate-key', 'levelSelect'); btn.textContent = T().levelSelect; btn.onclick = showLevelSelect;
  } else if (next > 1 && next <= levels.length) {
    btn.removeAttribute('data-translate-key');
    btn.textContent = `${T().continue} (${T().level} ${next})`; btn.onclick = () => startGame(next);
  } else {
    btn.setAttribute('data-translate-key', 'newGame'); btn.textContent = T().newGame; btn.onclick = () => startGame(1);
  }
}

/* ---------- Progress ---------- */
function saveProgress() { store.set('lightsOnProgress', JSON.stringify(gameState.progress)); }
function loadProgress() {
  try {
    const saved = JSON.parse(store.get('lightsOnProgress'));
    if (saved && typeof saved === 'object') gameState.progress = { ...defaultProgress(), ...saved, pbs: { ...(saved.pbs || {}) } };
  } catch (e) { gameState.progress = defaultProgress(); }
}

/* ---------- Tutorial ---------- */
function runTutorial() {
  loadLevel(1);
  showScreen('game-screen');
  const ov = screens['tutorial-overlay'], hl = $('tutorial-highlight'), tb = $('tutorial-text-box');
  const txt = $('tutorial-text'), ok = $('tutorial-ok-btn');
  const steps = [
    { el: () => gameState.cells[5], key: 'tutorial_step1' },
    { el: () => movesDisplay, key: 'tutorial_step2' },
    { el: () => $('controls'), key: 'tutorial_step3' }
  ];
  let step = 0, timer = null, rect = null;

  // Position the spotlight. `instant` skips the CSS transition, so the first step never
  // animates in from an empty/full-screen box (this was the flash).
  function place(instant) {
    if (instant) hl.style.transition = 'none';
    hl.classList.toggle('spotlight-bright', step === 0);
    rect = steps[step].el().getBoundingClientRect();
    Object.assign(hl.style, { width: `${rect.width + 10}px`, height: `${rect.height + 10}px`, top: `${rect.top - 5}px`, left: `${rect.left - 5}px` });
    txt.innerHTML = T()[steps[step].key];
    if (window.innerHeight - rect.bottom > 150) { tb.style.top = `${rect.bottom + 15}px`; tb.style.bottom = 'auto'; }
    else { tb.style.bottom = `${window.innerHeight - rect.top + 15}px`; tb.style.top = 'auto'; }
    if (instant) { void hl.offsetWidth; hl.style.transition = ''; }
  }
  function enable() {
    clearInterval(timer); ok.disabled = false; ok.classList.remove('timed-button'); ok.textContent = T().ok;
  }
  function show(instant) {
    place(instant); clearInterval(timer);
    let n = Math.ceil(TUTORIAL_DELAY / 1000);
    ok.disabled = true; ok.classList.add('timed-button'); ok.textContent = `${T().ok} (${n})`;
    timer = setInterval(() => { if (--n > 0) ok.textContent = `${T().ok} (${n})`; else enable(); }, 1000);
  }
  // Overlay blocks everything except a tap on the spotlighted tile during step 1
  ov.onclick = e => {
    if (e.target !== ov || step !== 0) return;
    const r = steps[0].el().getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) { handleCellClick(5); enable(); }
  };
  ok.onclick = () => {
    if (++step < steps.length) { show(false); return; }
    clearInterval(timer); tutorialRefresh = null;
    ov.classList.add('hidden');
    gameState.progress.tutorialCompleted = true; saveProgress();
    resetLevel();
  };
  tutorialRefresh = () => place(true);
  show(true);                      // place first, then reveal: no flash
  ov.classList.remove('hidden');
}
addEventListener('resize', () => { if (tutorialRefresh) tutorialRefresh(); });

/* ---------- Init ---------- */
function main() {
  loadProgress();
  createGrid(4);
  $('reset-btn').onclick = resetLevel;
  $('hint-btn').onclick = showHint;
  $('game-menu-btn').onclick = () => (gameState.progress.highestLevelBeaten >= 5 ? showLevelSelect() : goToStartScreen());
  $('reset-progress-btn').onclick = () => {
    if (!confirm(T().resetConfirm)) return;
    store.del('lightsOnProgress');
    gameState.progress = defaultProgress();
    setLanguage(currentLanguage);
  };
  const skip = $('skip-level-btn');
  if (devmode === 0) skip.remove();
  else skip.onclick = () => { gameState.moves = curLevel().par; handleWin(); };
  $('level-select-main-menu-btn').onclick = goToStartScreen;
  $('language-toggle-btn').onclick = () => setLanguage(currentLanguage === 'en' ? 'ar' : 'en');
  setLanguage(currentLanguage);
  showScreen('start-screen');
}
main();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
